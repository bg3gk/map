<div class="hero">
<h1>Three maps of one game</h1>
<p class="lead">Everything <a href="https://github.com/bg3gk/gatekit">GateKit</a> knows about Baldur&rsquo;s Gate 3, as pages you can
click through. Every page is drawn from a <code class="id">.json</code> you can fetch yourself, and every value that names
something else is a link &mdash; so following a thread is clicking through it.</p>
</div>
<div class="maps">
<div class="map">
<h2>The game&rsquo;s own content</h2>
<p>What Larian ships, read out of the packages: who speaks which line, what a stat does, what a template is made of,
where a timeline hides a weapon.</p>
<ul class="kinds">
<li><code class="pt">/entity/&lt;uuid&gt;</code></li>
<li><code class="pt">/dialog/&lt;name&gt;</code></li>
<li><code class="pt">/timeline/&lt;uuid&gt;</code></li>
<li><code class="pt">/template/&lt;uuid&gt;</code></li>
<li><code class="pt">/stat/&lt;name&gt;</code></li>
<li><code class="pt">/level/&lt;name&gt;</code></li>
<li><code class="pt">/loca/&lt;handle&gt;</code></li>
<li><code class="pt">/object/&lt;key&gt;</code></li>
<li><code class="pt">/source/&lt;package&gt;/&lt;path&gt;</code></li>
<li><code class="pt">/package/&lt;name&gt;</code></li>
<li><code class="pt">/osiris/&lt;name&gt;</code></li>
</ul>
</div>
<div class="map">
<h2>Our map of the engine&rsquo;s components</h2>
<p>What no file of the game says: what each component&rsquo;s memory holds, field by field, and where in the game it was
actually seen alive. Read out of a running game over several weeks.</p>
<ul class="kinds">
<li><code class="pt">/component/&lt;name&gt;</code></li>
</ul>
</div>
<div class="map">
<h2>The engine&rsquo;s own symbols</h2>
<p>Facts about the binaries: which classes exist, how Script Extender declares them, which methods the Toolkit exports
and where the entity component system registers each type.</p>
<ul class="kinds">
<li><code class="pt">/symbol/&lt;name&gt;</code></li>
<li><code class="pt">/enum/&lt;name&gt;</code></li>
<li><code class="pt">/function/bg3.exe+0x&lt;address&gt;</code></li>
</ul>
</div>
</div>
{{AIM}}
<h2>The thread</h2>
<p class="lead">A component is seen on an object, the object is placed in a level and speaks in a dialogue, the dialogue is
staged by a timeline, the timeline hides a weapon at a frame &mdash; and the class the component is declared as has its own
page among the symbols. Every one of those steps is a link, in both directions. Walking that by hand is what this project
spent weeks doing.</p>
<p class="lead">A name with <code class="id">::</code> in it is written with a dot in an address:
<code class="pt">/component/ecl.ActiveTurnComponent</code>. Add <code class="id">.json</code> to any address for the same
page as data; <a href="{{BASE}}llms.txt">llms.txt</a> describes the scheme, so an agent builds an address from an id it
already has instead of scraping anything.</p>
<p class="lead">Search finds every line of the game&rsquo;s text in all of its languages, every object by its name, and
every page by its id. A line of text links to its own page, which has it in every language.</p>
